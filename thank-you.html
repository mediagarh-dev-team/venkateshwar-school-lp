<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thank You | Venkateshwar Global School</title>
    <meta name="robots" content="noindex, nofollow" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;800&family=Golos+Text:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="images/favicon.ico" />

    <style>
      :root {
        --navy: #081349;
        --yellow: #ffd447;
        --blue: #2e3f96;
        --soft: #f3f5fa;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Gabarito', sans-serif;
        background: var(--soft);
        color: var(--navy);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ── header ── */
      .ty-header {
        background: #fff;
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 1px solid #e8ebf4;
        box-shadow: 0 2px 12px rgba(8, 19, 73, 0.06);
      }
      .ty-logo {
        display: inline-flex;
        text-decoration: none;
      }
      .ty-logo img {
        height: 48px;
        width: auto;
        display: block;
      }

      /* ── main ── */
      .ty-main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 56px 20px;
      }

      .ty-card {
        width: 100%;
        max-width: 520px;
        background: #fff;
        border: 1px solid #e8ebf4;
        border-radius: 24px;
        padding: 52px 44px 48px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(8, 19, 73, 0.08);
      }

      /* animated tick */
      .ty-icon {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: var(--yellow);
        display: grid;
        place-items: center;
        margin: 0 auto 28px;
        font-size: 34px;
        color: var(--navy);
        box-shadow: 0 12px 32px rgba(255, 212, 71, 0.4);
        animation: ty-pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      @keyframes ty-pop {
        from {
          transform: scale(0);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .ty-heading {
        font-size: clamp(24px, 5vw, 34px);
        font-weight: 800;
        line-height: 1.2;
        color: var(--navy);
        margin-bottom: 10px;
      }
      .ty-heading span {
        color: var(--blue);
      }

      .ty-sub {
        font-family: 'Golos Text', sans-serif;
        font-size: 15px;
        line-height: 1.65;
        color: rgba(8, 19, 73, 0.6);
        margin-bottom: 36px;
      }
      .ty-sub strong {
        color: var(--navy);
      }

      /* details box */
      .ty-details {
        background: var(--soft);
        border: 1px solid #e8ebf4;
        border-radius: 14px;
        padding: 20px 22px;
        margin-bottom: 36px;
        text-align: left;
      }
      .ty-details-title {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--blue);
        margin-bottom: 14px;
      }
      .ty-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 0;
        border-bottom: 1px solid #e8ebf4;
        font-family: 'Golos Text', sans-serif;
        font-size: 14px;
      }
      .ty-row:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .ty-row:first-of-type {
        padding-top: 0;
      }

      .ty-row-icon {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: #fff;
        border: 1px solid #e8ebf4;
        display: grid;
        place-items: center;
        flex: none;
        color: var(--blue);
        font-size: 15px;
        box-shadow: 0 2px 6px rgba(8, 19, 73, 0.07);
      }
      .ty-row-label {
        font-size: 11px;
        color: rgba(8, 19, 73, 0.45);
        display: block;
        margin-bottom: 2px;
      }
      .ty-row-value {
        color: var(--navy);
        font-weight: 600;
        word-break: break-all;
      }

      /* cta button */
      .ty-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 13px 30px;
        background: var(--navy);
        color: #fff;
        border: 2px solid var(--navy);
        border-radius: 8px;
        font-family: 'Gabarito', sans-serif;
        font-weight: 700;
        font-size: 15px;
        text-decoration: none;
        transition: 0.3s ease;
      }
      .ty-btn:hover {
        background: var(--yellow);
        border-color: var(--yellow);
        color: var(--navy);
        transform: translateY(-2px);
        box-shadow: 0 10px 28px rgba(8, 19, 73, 0.15);
      }
      .ty-btn i {
        transition: transform 0.3s ease;
      }
      .ty-btn:hover i {
        transform: translateX(-4px);
      }

      /* ── footer ── */
      .ty-footer {
        background: #fff;
        padding: 18px 24px;
        text-align: center;
        border-top: 1px solid #e8ebf4;
        font-family: 'Golos Text', sans-serif;
        font-size: 13px;
        color: rgba(8, 19, 73, 0.4);
      }

      @media (max-width: 480px) {
        .ty-card {
          padding: 36px 24px 32px;
          border-radius: 18px;
        }
      }
    </style>
  </head>
  <body>
    <!-- header -->
    <header class="ty-header">
      <a href="index.html" class="ty-logo" aria-label="Back to home">
        <img src="images/logo.svg" alt="Venkateshwar Global School" />
      </a>
    </header>

    <!-- main -->
    <main class="ty-main">
      <div class="ty-card">
        <div class="ty-icon" aria-hidden="true">
          <i class="bi bi-check-lg"></i>
        </div>

        <h1 class="ty-heading">Thank You,<br /><span id="tyName">there</span>!</h1>
        <p class="ty-sub">
          Your admission enquiry has been received.<br />
          Our team will get in touch with you within <strong>24 hours</strong>.
        </p>

        <!-- submitted details -->
        <div class="ty-details">
          <p class="ty-details-title">Your Submission Details</p>

          <div class="ty-row">
            <span class="ty-row-icon"><i class="bi bi-person"></i></span>
            <div>
              <span class="ty-row-label">Name</span>
              <span class="ty-row-value" id="tyNameDetail">—</span>
            </div>
          </div>

          <div class="ty-row">
            <span class="ty-row-icon"><i class="bi bi-envelope"></i></span>
            <div>
              <span class="ty-row-label">Email</span>
              <span class="ty-row-value" id="tyEmail">—</span>
            </div>
          </div>

          <div class="ty-row">
            <span class="ty-row-icon"><i class="bi bi-telephone"></i></span>
            <div>
              <span class="ty-row-label">Mobile</span>
              <span class="ty-row-value" id="tyMobile">—</span>
            </div>
          </div>
        </div>

        <a href="index.html" class="ty-btn"> <i class="bi bi-arrow-left"></i> Back to Home </a>
      </div>
    </main>

    <!-- footer -->
    <footer class="ty-footer">&copy; <span id="tyYear"></span> Venkateshwar Global School. All rights reserved.</footer>

    <script>
      const params = new URLSearchParams(window.location.search);
      const name = params.get('name') || '';
      const email = params.get('email') || '';
      const mobile = params.get('mobile') || '';

      document.getElementById('tyName').textContent = name || 'there';
      document.getElementById('tyNameDetail').textContent = name || '—';
      document.getElementById('tyEmail').textContent = email || '—';
      document.getElementById('tyMobile').textContent = mobile || '—';
      document.getElementById('tyYear').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
